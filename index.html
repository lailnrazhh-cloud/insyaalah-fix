<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Kartu Bilangan Bulat - Pembelajaran Visual & Kuis</title>
  <style>
    :root {
      --positif-color: #2e7d32;
      --positif-bg: #e8f5e9;
      --negatif-color: #c62828;
      --negatif-bg: #ffebee;
      --neutral-bg: #f5f5f5;
      --text-dark: #212121;
      --primary-color: #1565c0;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 26px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Tab Navigasi */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background-color: white;
      color: var(--primary-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Area Kontrol Input */
    .control-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background-color: var(--neutral-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 18px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 90px;
      padding: 8px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-weight: bold;
    }

    select {
      padding: 8px;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    button.btn-action {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-action:hover {
      background-color: #0d47a1;
    }

    /* Visualisasi Area Kartu */
    .board {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: 200px;
      padding: 20px;
      border: 3px dashed #bbb;
      border-radius: 12px;
      background-color: #fafafa;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: white;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }

    .row-title {
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
      color: #444;
    }

    .group-box {
      border: 2px dashed #9e9e9e;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #fdfdfd;
    }

    /* Elemen Kartu */
    .card {
      width: 50px;
      height: 65px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      transition: all 0.3s ease;
      user-select: none;
    }

    .card.positive {
      background-color: var(--positif-bg);
      color: var(--positif-color);
      border: 3px solid var(--positif-color);
    }

    .card.negative {
      background-color: var(--negatif-bg);
      color: var(--negatif-color);
      border: 3px solid var(--negatif-color);
    }

    .card.neutral-pair {
      opacity: 0.3;
      transform: scale(0.85);
      border-style: dashed;
    }

    /* Area Hasil Visual */
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      background-color: #e3f2fd;
      border: 2px solid #90caf9;
    }

    .result-text {
      font-size: 26px;
      font-weight: bold;
      color: #0d47a1;
    }

    .explanation-text {
      font-size: 15px;
      color: #333;
      margin-top: 8px;
      line-height: 1.4;
    }

    .visual-guide {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 14px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .guide-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-card {
      width: 22px;
      height: 26px;
      border-radius: 4px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* Tampilan Kuis */
    .quiz-card {
      background-color: var(--neutral-bg);
      padding: 25px;
      border-radius: 12px;
      text-align: center;
    }

    .quiz-question {
      font-size: 32px;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 500px;
      margin: 0 auto 20px auto;
    }

    .quiz-btn {
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      background-color: white;
      border: 3px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quiz-btn:hover {
      background-color: #e3f2fd;
    }

    .quiz-feedback {
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
      margin-bottom: 15px;
    }

    .score-board {
      font-size: 18px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🟨 MEDIA KARTU BILANGAN BULAT 🟦</h1>
  <div class="subtitle">Penjumlahan, Pengurangan, Perkalian & Pembagian Secara Visual</div>

  <!-- Navigasi Tab Mode -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('simulasi')">Simulasi Visual</button>
    <button class="tab-btn" onclick="switchTab('kuis')">Kuis Interaktif</button>
  </div>

  <!-- TAB 1: SIMULASI VISUAL -->
  <div id="simulasi" class="tab-content active">
    <!-- Petunjuk Warna -->
    <div class="visual-guide">
      <div class="guide-item">
        <span class="mini-card" style="background:var(--positif-bg); color:var(--positif-color); border:2px solid var(--positif-color);">+</span>
        <span>Kartu Positif (+1)</span>
      </div>
      <div class="guide-item">
        <span class="mini-card" style="background:var(--negatif-bg); color:var(--negatif-color); border:2px solid var(--negatif-color);">-</span>
        <span>Kartu Negatif (-1)</span>
      </div>
      <div class="guide-item">
        <span>( + ) + ( - ) = 0 (Netral)</span>
      </div>
    </div>

    <br>

    <!-- Panel Input Angka -->
    <div class="control-panel">
      <div class="input-group">
        <label for="num1">Bilangan 1:</label>
        <input type="number" id="num1" value="3" min="-12" max="12">
      </div>

      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>

      <div class="input-group">
        <label for="num2">Bilangan 2:</label>
        <input type="number" id="num2" value="-2" min="-12" max="12">
      </div>

      <button class="btn-action" onclick="hitung()">HITUNG & TAMPILKAN</button>
    </div>

    <!-- Area Kartu -->
    <div class="board" id="board">
      <!-- Kartu akan dirender di sini via JavaScript -->
    </div>

    <!-- Kotak Hasil -->
    <div class="result-box">
      <div class="result-text" id="result-text">3 + (-2) = 1</div>
      <div class="explanation-text" id="explanation-text"></div>
    </div>
  </div>

  <!-- TAB 2: KUIS INTERAKTIF -->
  <div id="kuis" class="tab-content">
    <div class="quiz-card">
      <div class="quiz-question" id="quiz-question">3 × (-2) = ?</div>
      <div class="quiz-options" id="quiz-options">
        <!-- Pilihan jawaban akan dirender di sini -->
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <div class="score-board">
        Skor: <span id="score-val">0</span> | Benar: <span id="correct-val">0</span> / <span id="total-val">0</span>
      </div>
      <br>
      <button class="btn-action" onclick="generateQuiz()">Soal Berikutnya</button>
    </div>
  </div>
</div>

<script>
  // Fungsi Pengubah Tab
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');

      generateQuiz();
    }
  }

  // Helper pembuat elemen kartu
  function createCardElement(isPositive, isNeutral = false) {
    const card = document.createElement('div');
    card.className = `card ${isPositive ? 'positive' : 'negative'} ${isNeutral ? 'neutral-pair' : ''}`;
    card.textContent = isPositive ? '+' : '-';
    return card;
  }

  // Helper render sejumlah kartu ke dalam container
  function renderCardGroup(container, count, isPositive) {
    const absCount = Math.abs(count);
    for (let i = 0; i < absCount; i++) {
      container.appendChild(createCardElement(isPositive));
    }
  }

    const resultText = document.getElementById('result-text');
    const expText = document.getElementById('explanation-text');

    }
